<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b29"><title>River Company</title><meta name="description" content="Build a datacenter. Follow the market. Watch the river."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182b29'/%3E%3Cpath d='M5 24L12 18L17 20L27 7' stroke='%23dbef89' stroke-width='3' fill='none'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main id="game"><div id="world" aria-label="Interactive river valley. Select an action, then choose a land tile." role="application"></div><div class="vignette"></div>
<header><div class="brand"><span class="brandmark">↗</span><div>RIVER COMPANY<small>RIO / 01</small></div></div><div class="controls"><button id="sound" aria-label="Enable sound" title="Sound">♪</button><button id="pause" aria-label="Pause" title="Pause">Ⅱ</button><button id="speed" aria-label="Simulation speed" title="Simulation speed">1×</button><button id="restart" aria-label="Restart" title="Restart">↻</button></div></header>
<aside class="market"><div class="wallet" aria-label="Available cash"><span aria-hidden="true">◉</span><strong id="cash">46</strong><small>CASH</small></div><div class="market-label"><span>RC / MARKET</span><span id="trend">↗</span></div><svg id="chart" viewBox="0 0 220 65" role="img" aria-label="Company share-price chart"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#d8f293" stop-opacity=".23"/><stop offset="1" stop-color="#d8f293" stop-opacity="0"/></linearGradient></defs><path id="chartfill" fill="url(#fade)"/><path id="chartline" fill="none" stroke="#d8f293" stroke-width="2"/><circle id="chartdot" r="3" fill="#d8f293"/></svg><div class="operations" aria-label="Infrastructure"><div id="energy" class="resource" role="img" title="Electricity"><span>⚡</span><div><i></i></div></div><div id="compute" class="resource" role="img" title="AI capacity online"><span>▥</span><div><i></i></div></div><div id="water" class="resource" role="img" title="Cooling"><span>≋</span><div><i></i></div></div></div><div class="season"><span>◷</span><div><i id="seasonfill"></i></div><span>☼</span></div></aside>
<section class="contracts" aria-label="Contracts"><div class="section-label">CONTRACTS <span id="contract-state">◇ ◇ ◇</span></div><div id="offers"></div></section>
<div id="hint" role="status">Choose a home for your datacenter <span>↙</span></div>
<footer><div class="toolbar" role="toolbar" aria-label="Construction"><button data-tool="server" aria-label="Build another datacenter" title="Datacenter · S"><span>▥</span><small>DATA</small><i>▰▰</i></button><button data-tool="solar" aria-label="Build solar panels" title="Solar · R"><span>☀</span><small>SOLAR</small><i>▰▰</i></button><button data-tool="coal" aria-label="Build fossil generator" title="Fossil generator · F"><span>♨</span><small>FOSSIL</small><i>▰</i></button><button data-tool="cooling" aria-label="Improve cooling" title="Cooling · W"><span>≋</span><small>COOLING</small><i>▰▰</i></button><div class="divider"></div><button data-tool="cut" aria-label="Cut a tree" title="Cut tree · X"><span>╱</span><small>CUT</small><i>↗</i></button><button data-tool="plant" aria-label="Plant a tree" title="Plant tree · T"><span>♧</span><small>PLANT</small><i>▰</i></button></div><div class="footer-caption"><span id="mode-label">⌖ &nbsp; PLACE DATACENTER</span><span>◈ &nbsp; RIVER VALLEY</span></div></footer>
<section id="interior-hud" hidden aria-label="Datacenter interior controls"><button id="leave-interior" aria-label="Return to the valley">↙ <span>VALLEY</span></button><div class="interior-name"><span>▥</span><span id="interior-title">DATA / 01</span><span id="interior-status" role="img" aria-label="Datacenter offline">⚡</span></div><div class="interior-zoom"><button id="interior-zoom-out" aria-label="Zoom out inside datacenter">−</button><button id="interior-zoom-in" aria-label="Zoom in inside datacenter">+</button></div></section>
<div id="ending" hidden><div class="endcard"><span id="end-symbol"></span><h1 id="end-title"></h1><p id="end-copy"></p><svg id="end-chart" viewBox="0 0 220 65"></svg><button id="again">↻ &nbsp; Play again</button></div></div><div id="fallback" hidden>Unable to start the 3D view. Please try a browser with WebGL enabled.</div></main><script type="module" src="game.js"></script></body></html>
